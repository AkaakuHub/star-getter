name: Deploy game portal

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '.github/**'
      - 'lefthook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: AkaakuHub/game-portal/.github/workflows/deploy.yml@main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
